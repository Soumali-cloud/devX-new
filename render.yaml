services:
  - type: web
    name: himyatra-backend
    runtime: docker
    # This repository is a monorepo. Both paths are intentionally rooted at
    # the repository so Docker can copy the API and its sibling ML packages.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # CORSMiddleware reads this as a JSON array. Add preview/custom frontend
      # URLs here when those sites need to call the API from a browser.
      - key: CORS_ORIGINS
        value: '["https://himyatra.netlify.app"]'
